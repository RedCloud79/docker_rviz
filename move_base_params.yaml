base_global_planner: global_planner/GlobalPlanner
base_local_planner: teb_local_planner/TebLocalPlannerROS

planner_frequency: 1.5
controller_frequency: 15.0
planner_patience: 180.0
controller_patience: 5.0
max_planning_retries: -1

oscillation_timeout: 0.0
oscillation_distance: 0.25

make_plan_clear_costmap: false
make_plan_add_unreachable_goal: false
clearing_radius: 0.5
shutdown_costmaps: false
clearing_rotation_allowed: true


xy_goal_tolerance: 0.05
yaw_goal_tolerance: 0.03
latch_xy_goal_tolerance: true

# global_costmap:
#   robot_base_frame: base_footprint
#   global_frame: map
# local_costmap:
#   robot_base_frame: base_footprint
#   global_frame: odom

recovery_behavior_enabled: false
recovery_behaviors: [
  {name: reset_local_costmap, type: clear_costmap_recovery/ClearCostmapRecovery},
  {name: reset_global_costmap, type: clear_costmap_recovery/ClearCostmapRecovery},
]

reset_local_costmap:
  reset_distance: 3.0
  invert_area_to_clear: false
  force_updating: true
  affected_maps: "local"
  layer_names: ["obstacle_layer"]

reset_global_costmap:
  reset_distance: 3.0
  invert_area_to_clear: false
  force_updating: true
  affected_maps: "global"
  layer_names: ["obstacle_layer"]
