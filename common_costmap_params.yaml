
global_frame: map
# robot_base_frame: base_link
# global_frame: odom
robot_base_frame: base_footprint
rolling_window: true
track_unknown_space: false
always_send_full_costmap: false

transform_tolerance: 0.7
update_frequency: 5.0
publish_frequency: 5.0
resolution: 0.05
origin_x: 0
origin_y: 0
robot_radius: 0.0
footprint: [[-0.41, -0.215], [-0.41, 0.215], [0.41, 0.215], [0.41, -0.215]]
# footprint: [[-0.82, -0.43], [-0.82, 0.43], [0.82, 0.43], [0.82, -0.43]]
footprint_padding: 0.05

static_layer:
  map_topic: map
  first_map_only: false
  subscribe_to_updates: false
  track_unknown_space: false
  use_maximum: true
  lethal_cost_threshold: 100
  unknown_cost_value: -1
  trinary_costmap: true

obstacle_layer:
  enabled: true
  track_unknown_space: false
  transform_tolerance: 1.0
  combination_method: 1
  footprint_clearing_enabled: true
  observation_sources: scan

  scan:
    topic: /scan
    data_type: LaserScan
    marking: true
    clearing: true
    inf_is_valid: true
    observation_persistence: 0.2
    expected_update_rate: 5.0
    obstacle_range: 6.0
    raytrace_range: 10.0  

inflation_layer:
  # from cfg file
  enabled: true
  cost_scaling_factor: 3.0
  inflation_radius: 0.45
  inflate_unknown: false

virtual_layer_local:
  enabled:              true
  zone_topics:          [/virtual_costmap_layer/zone]
  obstacle_topics:      [/virtual_costmap_layer/obstacles]
  one_zone:             false
  clear_obstacles:      false     
  map_frame:            map
  base_frame:           base_footprint

virtual_layer_global:
  enabled:              true
  zone_topics:          [/virtual_costmap_layer/zone]
  obstacle_topics:      [/virtual_costmap_layer/obstacles]
  one_zone:             false
  clear_obstacles:      false     
  map_frame:            map
  base_frame:           base_footprint
