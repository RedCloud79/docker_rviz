obstacle_range: 30.0
raytrace_range: 50.0

observation_sources: scan
scan: {sensor_frame: base_scan, data_type: LaserScan, topic: scan, marking: true, clearing: true,inf_is_valid: true}

static_layer:
  enabled:              true
  map_topic:            /map

obstacle_layer:
  observation_sources: scan
  scan: {sensor_frame: base_scan, data_type: LaserScan, topic: scan, marking: true, clearing: true, inf_is_valid: false}

virtual_layer_local:
  enabled:              true
  zone_topics:          [/virtual_costmap_layer/zone]
  obstacle_topics:      [/virtual_costmap_layer/obsctacles]
  one_zone:             false
  clear_obstacles:      false     
  map_frame:            map
  base_frame:           base_footprint

virtual_layer_global:
  enabled:              true
  zone_topics:          [/virtual_costmap_layer/zone]
  obstacle_topics:      [/virtual_costmap_layer/obsctacles]
  one_zone:             false
  clear_obstacles:      false     
  map_frame:            map
  base_frame:           base_footprint
